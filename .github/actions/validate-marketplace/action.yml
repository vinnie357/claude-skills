name: 'Validate Claude Skills Marketplace'
description: 'Validates marketplace.json and all plugin.json files using mise and Nushell'
runs:
  using: 'composite'
  steps:
    - name: Install mise
      shell: bash
      run: |
        curl https://mise.run | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # The cache key carries the newest claude release, so a new release is a
    # cache miss. Keying on mise.toml alone ignores the resolved version of
    # `claude = "latest"` and restores an older claude.
    - name: Resolve latest claude version
      id: claude-version
      shell: bash
      run: |
        mise trust
        version="$(mise latest claude)"
        if [ -z "$version" ]; then
          echo "mise latest claude returned an empty version" >&2
          exit 1
        fi
        echo "claude=$version" >> "$GITHUB_OUTPUT"

    # No restore-keys: a prefix fallback would restore a cache built for a
    # different claude version, which is the staleness this key prevents.
    # The mise binary is not cached, so a restore cannot replace it.
    - name: Cache mise tools
      uses: actions/cache@v6
      with:
        path: ~/.local/share/mise
        key: mise-${{ runner.os }}-claude-${{ steps.claude-version.outputs.claude }}-${{ hashFiles('mise.toml') }}

    - name: Fetch main branch for version comparison
      shell: bash
      run: git fetch origin main:main 2>/dev/null || true

    - name: Install tools via mise
      shell: bash
      run: |
        mise trust
        mise install

    - name: Run marketplace validation
      shell: bash
      run: |
        mise test
