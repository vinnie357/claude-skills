notes = "sources.md Date Accessed 2026-04-04. iframe, iframe-left, iframe-right layouts, URL property. claude-skills-223 tier 2 continuation, 2026-08-05: re-verified against packages/client/layouts/iframe{,-left,-right}.vue on the slidevjs/slidev GitHub repo instead of the doc site. iframe/iframe-left/iframe-right and the url prop confirmed (plus an undocumented scale prop, not added — out of scope). CORRECTION: 'add class: border-0 to remove the default iframe border' does not work, but not for the reason first written here — there is no default iframe border to remove at all (every deck loads @unocss/reset/tailwind.css, zeroing border-width deck-wide per packages/client/styles/index.ts). The class-binding-to-the-wrong-element analysis also stands but SlideWrapper.vue does not support it (its class comes from getSlideClass/utils.ts, unrelated to frontmatter class) — the real path is class's absence from FRONTMATTER_FIELDS (constants.ts) through frontmatterToProps (context.ts) to Vue's attribute-fallthrough onto the layout's own root element. Fixed in iframe-mocks.md: states plainly there is nothing to remove, gives the correct citation, and reframes any #frame CSS as adding a border if wanted, not removing one."
