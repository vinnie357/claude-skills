# entries below, most still marked "Not re-verified live in this pass."
#
# claude-skills-223 tier 2 continuation, 2026-08-05: the six skills the note
# above left unchecked (code, export, interactive, presentations, styles,
# troubleshooting) now got a claim-by-claim pass against live slidevjs/slidev
# source (packages/types/src/{frontmatter,cli,config}.ts; packages/slidev/
