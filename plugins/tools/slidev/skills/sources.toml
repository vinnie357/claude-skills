#
# Corrections (code, troubleshooting): both still required only `mdc: true`
# for code groups / MDC syntax, uncaveated — same deprecated-in-favor-of-
# comark issue the July 30 pass fixed in syntax.md, left unfixed here.
#
# Corrections (interactive) — the highest-value find of this pass: SKILL.md,
# vue-components.md (x2), and animation-patterns.md all called a nav-context
# property `$slidev.nav.isExporting` to detect export/print rendering. That
# property does not exist — verified against useNav.ts, the real property is
# `isPrintMode`. SKILL.md separately conflated `isPresenter` (presenter
# dual-window view) with export detection on the same line — a second,
# distinct error. Both are the "inverted/wrong API name" class of finding
# the bee's method flags as highest-value.
#
# Correction (interactive, iframe-mocks.md): "add class: 'border-0' to
# remove the default iframe border" does not work — verified against
# iframe.vue and SlideWrapper.vue that frontmatter `class` binds to the
# slide's root wrapper, not the nested `<iframe id="frame">`, and CSS
# border does not inherit through descendants. Corrected to global CSS
# targeting `#frame` directly.
#
# Corrections (styles, theme-generation.md): package.json `keywords` example
# listed only `"slidev-theme"` — write-theme.md requires both `"slidev-
# theme"` and `"slidev"`. Fixed and held up under Gate 3 re-review.
#
# Additions (export.md) — real, verified CLI surface the skill omitted
# entirely: the `export-notes` command; `--per-slide` and `--scale` for
# `slidev export`; `--router-mode` for `slidev build`; `--base`, `--log`,
# `--inspect`, `--tunnel` for the dev server. `--wait`'s documented default
# was `—` (blank); actual default is `0`, corrected.
#
# Additions (code.md) — verified against source, previously undocumented:
# line-highlighting's `{hide}`/`{none}` special values; Magic Move's
# `{at:N}`, per-block `duration`/headmatter `magicMoveDuration` (default
# 800ms), and the filename title-bar syntax (since v0.52.0).
#
# Gate 3 (adversarial review) round, 2026-08-05 — REJECT, 5 findings, all
# independently re-verified against a fresh clone before acting (not taken on
# the reviewer's word):
#
# F1 — `slidev.highlighter` is NOT fabricated; my first pass wrongly removed
# it from theme-generation.md's package.json sample and called it fake in
# this file's own notes and the PR body. It is real, undocumented-by-
# write-theme.md-but-real theme metadata: `SlidevThemeMeta` interface
# (packages/types/src/types.ts: "Metadata for 'slidev' field in themes'
# package.json" — defaults/colorSchema/highlighter), consumed directly in
# `resolveConfig` (packages/parser/src/config.ts, `themeMeta.highlighter`).
# Restored, with an accurate note instead of "fabricated."
# F2 — the `#frame { border: none }` replacement I gave for the debunked
# `class: "border-0"` claim fixed a border that doesn't exist: every Slidev
# deck loads `@unocss/reset/tailwind.css` first (packages/client/styles/
# index.ts), which zeroes border-width deck-wide, and no slidev stylesheet
# re-adds one to the iframe. Corrected to state plainly that there is
# nothing to remove, and reframed the CSS snippet as how to ADD a border if
# wanted, not "remove" one. Also fixed the citation for the class-binding
# mechanism — SlideWrapper.vue's class comes from getSlideClass (utils.ts),
# which never touches frontmatter `class` at all; the real path is `class`
# absent from FRONTMATTER_FIELDS/HEADMATTER_FIELDS (constants.ts) →
# frontmatterToProps (context.ts) passes it through unresolved → Vue
# attribute fallthrough lands it on the layout component's own root element.
# F3 — the comark fix was incomplete and my PR body overclaimed it as done.
# Grep-for-mdc-true was not enough; three sites still taught plain `mdc:
# true` uncaveated and one of them (syntax/references/syntax.md's own "##
# MDC Syntax" section) directly contradicted that same file's headmatter
# table three lines up. Fixed: syntax.md's MDC section (renamed to Comark,
# caveated), slidev/SKILL.md's example headmatter (mdc→comark plus a note),
# sources.md's prose description. Re-grepped `mdc\b` case-insensitively
# across the whole plugin after fixing to confirm no more uncaveated
# instructions remain (topic-name mentions like a heading titled "MDC
# syntax" as the feature's historical name are not claims and were left).
# F4 — the "latex/mermaid/plantuml were never written into any skill"
# content-gap claim was false. That content lives in syntax/references/
# syntax.md:327-370 ("## LaTeX Math", "### Mermaid", "### PlantUML") — I had
# only grepped the code skill, not the whole plugin, before declaring the
# gap. Re-attributed all three sources' `skills` arrays from ["code"] to
# ["syntax"] and re-verified each against live docs/features/{latex,mermaid,
# plantuml}.md (inline/block math, `{theme,scale}` options object,
# `plantUmlServer` default/override — all confirmed exact match).
# F5 — stale version bump: PR #232 merged all-skills to 0.4.131 on main
# after this branch forked, so this branch's 0.4.130→0.4.131 bump was a
# no-op that would ship content changes under an unchanged version. Rebased
# onto origin/main, re-read live versions, bumped all-skills to 0.4.132.
# slidev 0.2.6→0.2.7 was unaffected (still 0.2.6 on main) and unchanged.
#
# Nits fixed in the same round: code.md's Magic Move examples used a
# pre-existing (not introduced by me, but copied into my addition) 4-
# backtick-outer-fence-wrapping-4-backtick-inner-fence idiom that GitHub
# renders as one dangling code block instead of nested examples — bumped
# both outer fences to 5 backticks, matching docs/features/shiki-magic-
# move.md's own fencing. export.md's `--per-slide` description said "needed
# for global components"; upstream's own comment (cli.ts) hedges with
# "works better with" — softened to match, don't strengthen upstream's claim.
# Verified three previously-unchecked presentations claims flagged in
# review: `<v-click at="0">` (VClick.ts declares `at: {type: [Number,
# String], default: '+1'}` — confirmed), `layout: full` (full.vue exists in
# packages/client/layouts/ — confirmed), and one-pagers.md's `npx slidev
# export ... --format pdf --output ...`/`--timeout` flags (already verified
# via cli.ts/export.ts in the main pass). All three hold; see "Remaining
# uncovered" below for what in presentations is still genuinely unverified.
#
# Also corrected an overreach in this file's own slidev-code-blocks note:
# it had asserted "no 'finally' keyword found" for the at/finally line-
# highlighting terminology; docs/features/latex.md references "the at and
# finally options of code blocks" by name, so "does not exist" was too
# strong a claim from a search that came up empty — restated as genuinely
