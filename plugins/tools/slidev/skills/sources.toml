# remove the default iframe border" does not work — verified against
# iframe.vue and SlideWrapper.vue that frontmatter `class` binds to the
# slide's root wrapper, not the nested `<iframe id="frame">`, and CSS
# border does not inherit through descendants. Corrected to global CSS
# targeting `#frame` directly.
#
