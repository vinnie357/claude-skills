notes = "Repo relocated from steveyegge/beads to gastownhall/beads (HTTP redirect confirmed via GitHub API 2026-07-30, latest tag v1.1.2 as of 2026-08-04). The old docs URL steveyegge.github.io/beads/ 404s (confirmed 2026-08-04); beads.gascity.com is the live successor AND the GitHub-declared repo homepage (both fields identical per `gh api repos/gastownhall/beads`). Go module path stays github.com/steveyegge/beads per upstream docs/getting-started/installation.md — released Go modules still declare it for compatibility even though the repo lives under gastownhall/beads. Storage format is Dolt (a version-controlled SQL database), NOT JSONL + SQLite cache — the legacy SQLite backend was removed; `.beads/issues.jsonl` is export-only, not the source of truth. current_version left 'unknown' deliberately: `bd --version` installed locally reports 1.1.0 while the latest GitHub tag is v1.1.2, and the skill does not pin an exact patch. claude-skills-223 (2026-08-04) re-verified the full CLI surface live against `bd` 1.1.0 in throwaway Dolt-backed repos (git init + bd init --non-interactive, never the real tracker): confirmed create/list/show/dep add/dep list/label add/comment/close/children/cycle-rejection/directory-walk-up, and corrected several stale command forms the earlier Dolt-storage-only pass left behind — `bd list --labels` (does not exist; singular `--label`), `bd show --comments` (no such flag; `--include-comments` is JSON-only), `bd dep graph`/`bd dep blockers`/`bd dep blocking` (none exist; real forms are `bd dep tree`/`bd dep list [--direction=up]`), `bd label --add/--remove` (subcommand form only: `bd label add`/`bd label remove`), `bd unassign` (no such command; `bd assign <id> \"\"`), `bd sync`/`bd pull`/`bd tree`/`bd rebuild` (none exist; real equivalents are `bd dolt push`/`bd dolt pull`/`bd children`/`bd doctor`), and the JSON schema samples for `bd ready --json`/`bd show --json` (field names were stale — see SKILL.md for the live-verified shape; `bd show --json` returns an array even for one ID). Same corrections propagated to references/workflow-examples.md, references/teams-integration.md, and references/ide-integration.md. Gate 3 adversarial review (PR #219, 2026-08-04) caught two further errors in the first correction pass, both fixed after independent re-verification: the Hash-based IDs bullet claimed 4-hex-char IDs configurable via `bd config set id.hash_length`/`id.prefix` — live testing showed the real default is a 3-char base36 suffix (non-hex chars observed) and both config keys return 'not a recognized config key' warnings (the real prefix key, already set at init, is `issue_prefix`); and the Sync-with-Dolt section claimed bare `bd export` writes `.beads/issues.jsonl` — it actually streams JSONL to STDOUT, `bd export -o issues.jsonl` is the file-writing form. Also corrected on the same pass: the File Structure tree fabricated `issues.jsonl` (not present at init) while omitting `README.md`/`last-touched` (both real); `bd diff` needs two ref args; `bd dolt push` with no remote is a no-op with a message, not an error requiring one. claude-skills-244 (2026-08-06): repo-slug references re-confirmed correct (github.com/gastownhall/beads; the steveyegge/beads Go-module-path mentions in installation.md are the documented compatibility path, intentional and unchanged). Re-verified ONLY the SKILL.md:360 `bd diff HEAD~N` caveat against `bd` 1.1.2 (installed via `mise exec github:gastownhall/beads@1.1.2`, tested in a throwaway git+Dolt repo, never the real tracker): defect persists unchanged — `bd diff HEAD~1 HEAD` still errors (`Error: failed to get diff: invalid fromRef: invalid ref format: HEAD~1`, exit 1) while `bd diff main HEAD` still succeeds (`No changes between main and HEAD`, exit 0). Only that one line's cited version was bumped from 1.1.0 to 1.1.2; no other version-pinned claim in the skill (hash-ID suffix format, JSON schema field names, cycle-rejection message text, etc.) was re-tested this pass, so current_version stays 'unknown' rather than being bumped to 1.1.2 — the skill's inline citations remain a mix of bd 1.1.0 (most of the surface, unverified against 1.1.2) and bd 1.1.2 (Dolt-backend intro line, bd-diff caveat). Found but explicitly NOT fixed (outside repo scope, operator's machine): the operator's global `~/mise.toml` still pins `github:steveyegge/beads` — flagged for the operator to update manually. claude-skills-262 (2026-08-06): templates/mise.toml was checked for the first time in this line of passes — it had been missed when SKILL.md's command forms were corrected, so the template still shipped six bd forms that error on 1.1.2 (`bd sync`, `bd pull`, `bd rebuild`, `bd tree`, `bd dep graph`, `bd label --add`). Re-verified live against `bd` 1.1.2 (`mise exec github:gastownhall/beads@1.1.2`) in a throwaway git+Dolt repo: `bd sync`/`bd pull` corrected to `bd dolt push`/`bd dolt pull`; `bd dep graph` corrected to `bd dep tree <id>`; `bd tree` corrected to `bd children <id> --pretty`; `bd label $id --add $labels` corrected to a per-label loop over `bd label add $id $label` (confirmed `bd label add` takes one label per call and does not split a comma-separated string); `bd rebuild` removed outright, no equivalent exists (Dolt-backed releases have no SQLite cache to rebuild from JSONL). `bd status` re-confirmed working (prints 'Issue Database Status'); its task description was corrected from 'Show beads sync status' to reflect the real issue-count/status overview. This was a template-only check, not a full skill re-verification — `last_full_check` intentionally left unchanged."
