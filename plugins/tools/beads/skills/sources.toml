notes = "Repo relocated from steveyegge/beads to gastownhall/beads (HTTP redirect confirmed via GitHub API 2026-07-30, latest tag v1.1.2 as of 2026-08-04). The old docs URL steveyegge.github.io/beads/ 404s (confirmed 2026-08-04); beads.gascity.com is the live successor AND the GitHub-declared repo homepage (both fields identical per `gh api repos/gastownhall/beads`). Go module path stays github.com/steveyegge/beads per upstream docs/getting-started/installation.md — released Go modules still declare it for compatibility even though the repo lives under gastownhall/beads. Storage format is Dolt (a version-controlled SQL database), NOT JSONL + SQLite cache — the legacy SQLite backend was removed; `.beads/issues.jsonl` is export-only, not the source of truth. current_version left 'unknown' deliberately: `bd --version` installed locally reports 1.1.0 while the latest GitHub tag is v1.1.2, and the skill does not pin an exact patch. claude-skills-223 (2026-08-04) re-verified the full CLI surface live against `bd` 1.1.0 in throwaway Dolt-backed repos (git init + bd init --non-interactive, never the real tracker): confirmed create/list/show/dep add/dep list/label add/comment/close/children/cycle-rejection/directory-walk-up, and corrected several stale command forms the earlier Dolt-storage-only pass left behind — `bd list --labels` (does not exist; singular `--label`), `bd show --comments` (no such flag; `--include-comments` is JSON-only), `bd dep graph`/`bd dep blockers`/`bd dep blocking` (none exist; real forms are `bd dep tree`/`bd dep list [--direction=up]`), `bd label --add/--remove` (subcommand form only: `bd label add`/`bd label remove`), `bd unassign` (no such command; `bd assign <id> \"\"`), `bd sync`/`bd pull`/`bd tree`/`bd rebuild` (none exist; real equivalents are `bd dolt push`/`bd dolt pull`/`bd children`/`bd doctor`), and the JSON schema samples for `bd ready --json`/`bd show --json` (field names were stale — see SKILL.md for the live-verified shape; `bd show --json` returns an array even for one ID). Same corrections propagated to references/workflow-examples.md, references/teams-integration.md, and references/ide-integration.md."
