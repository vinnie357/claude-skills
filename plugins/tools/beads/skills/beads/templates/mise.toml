# multi-arch beads install
[tools."github:gastownhall/beads"]
version = "latest"

[tools."github:gastownhall/beads".platforms]
linux-x64 = { asset_pattern = "beads_*_linux_amd64.tar.gz" }
macos-arm64 = { asset_pattern = "beads_*_darwin_arm64.tar.gz" }

# Nushell — REQUIRED, not optional: every scripted task below runs under a
# `#!/usr/bin/env nu` shebang and fails with "env: nu: No such file or
# directory" if nu is not installed. Do not drop this entry because nu
# happens to already be on your PATH; a fresh clone of your project will not
# have it.
#
# Pinned rather than "latest" because nushell is pre-1.0 and breaking changes
# land between minor releases — the task scripts below use version-sensitive
# surface (`is-not-empty`, `split row`, optional `def main` params, `^cmd
# ...$spread`). "latest" would silently hand a new installer an untested
# version. To update: bump the version, then run every beads:* task once.
[tools."github:nushell/nushell"]
version = "0.113.1"
exe = "nu"

# Only the Linux assets need explicit patterns: nushell publishes both -gnu
# and -musl builds per Linux arch, so the choice is ambiguous. macOS assets
# are unambiguous and mise auto-resolves platforms left undeclared here.
[tools."github:nushell/nushell".platforms]
linux-x64 = { asset_pattern = "nu-*-x86_64-unknown-linux-gnu.tar.gz" }
macos-arm64 = { asset_pattern = "nu-*-aarch64-apple-darwin.tar.gz" }

# Beads (bd) mise tasks
# Copy these task definitions to your project's mise.toml

[tasks."beads:init"]
description = "Initialize beads in the repository (full mode - syncs to remote)"
run = "bd init"

[tasks."beads:init:stealth"]
description = "Initialize beads in stealth mode (local only, no commits)"
run = "bd init --stealth"

[tasks."beads:init:contributor"]
description = "Initialize beads in contributor mode (pull only, no push)"
run = "bd init --contributor"

[tasks."beads:ready"]
description = "List unblocked tasks ready for work"
run = '''
#!/usr/bin/env nu
let tasks = (bd ready --json | from json)
if ($tasks | is-empty) {
    print "No ready tasks"
} else {
    $tasks | select id title labels? | table
}
'''

[tasks."beads:list"]
description = "List all tasks with formatted output"
run = '''
#!/usr/bin/env nu
let tasks = (bd list --json | from json)
if ($tasks | is-empty) {
    print "No tasks found"
} else {
    $tasks | select id title status labels? assignee? | table
}
'''

[tasks."beads:show"]
description = "Show task details by ID"
run = '''
#!/usr/bin/env nu
def main [task_id: string] {
    let task = (bd show $task_id --json | from json)
    print $"(ansi green_bold)Task: ($task.id)(ansi reset)"
    print $"Title: ($task.title)"
    print $"Status: ($task.status)"
    if ($task.description? | is-not-empty) {
        print $"Description: ($task.description)"
    }
    if ($task.labels? | is-not-empty) {
        print $"Labels: ($task.labels | str join ', ')"
    }
    if ($task.assignee? | is-not-empty) {
        print $"Assignee: ($task.assignee)"
    }
    if ($task.dependencies? | is-not-empty) {
        print $"Depends on: ($task.dependencies | str join ', ')"
    }
    if ($task.blocking? | is-not-empty) {
        print $"Blocking: ($task.blocking | str join ', ')"
    }
}
'''

[tasks."beads:create"]
description = "Create a new task"
run = '''
#!/usr/bin/env nu
def main [
    title: string
    --description (-d): string  # Task description
    --labels (-l): string       # Comma-separated labels
    --assignee (-a): string     # Assignee name
    --parent (-p): string       # Parent task ID
] {
    mut args = ["create", $title]
    if ($description | is-not-empty) {
        $args = ($args | append ["--description", $description])
    }
    if ($labels | is-not-empty) {
        $args = ($args | append ["--labels", $labels])
    }
    if ($assignee | is-not-empty) {
        $args = ($args | append ["--assignee", $assignee])
    }
    if ($parent | is-not-empty) {
        $args = ($args | append ["--parent", $parent])
    }
    ^bd ...$args
}
'''

[tasks."beads:close"]
description = "Close a task by ID"
run = '''
#!/usr/bin/env nu
def main [task_id: string] {
    bd close $task_id
    print $"(ansi green)Closed task: ($task_id)(ansi reset)"
}
'''

[tasks."beads:reopen"]
description = "Reopen a closed task by ID"
run = '''
#!/usr/bin/env nu
def main [task_id: string] {
    bd reopen $task_id
    print $"(ansi yellow)Reopened task: ($task_id)(ansi reset)"
}
'''

[tasks."beads:sync"]
description = "Push local Dolt commits to the configured remote (bd sync does not exist; this is bd dolt push)"
run = "bd dolt push"

[tasks."beads:pull"]
description = "Pull commits from the configured Dolt remote (bd pull does not exist; this is bd dolt pull)"
run = "bd dolt pull"

[tasks."beads:status"]
description = "Show issue count/status overview (not sync status — see 'bd dolt status' for Dolt sync state)"
run = "bd status"

[tasks."beads:dep:add"]
description = "Add a dependency (task depends on blocker)"
run = '''
#!/usr/bin/env nu
def main [
    task_id: string    # Task that will be blocked
    blocker_id: string # Task that blocks
] {
    bd dep add $task_id $blocker_id
    print $"(ansi cyan)Added dependency: ($task_id) depends on ($blocker_id)(ansi reset)"
}
'''

[tasks."beads:dep:remove"]
description = "Remove a dependency"
run = '''
#!/usr/bin/env nu
def main [
    task_id: string    # Task to unblock
    blocker_id: string # Blocker to remove
] {
    bd dep remove $task_id $blocker_id
    print $"(ansi yellow)Removed dependency: ($task_id) no longer depends on ($blocker_id)(ansi reset)"
}
'''

[tasks."beads:dep:graph"]
description = "Show dependency tree rooted at an issue (bd dep graph does not exist; this is bd dep tree)"
run = '''
#!/usr/bin/env nu
def main [task_id: string] {
    bd dep tree $task_id
}
'''

[tasks."beads:comment"]
description = "Add a comment to a task"
run = '''
#!/usr/bin/env nu
def main [
    task_id: string # Task ID
    body: string    # Comment body
] {
    bd comment $task_id $body
    print $"(ansi green)Added comment to: ($task_id)(ansi reset)"
}
'''

[tasks."beads:assign"]
description = "Assign a task to someone"
run = '''
#!/usr/bin/env nu
def main [
    task_id: string  # Task ID
    assignee: string # Assignee name
] {
    bd assign $task_id $assignee
    print $"(ansi cyan)Assigned ($task_id) to ($assignee)(ansi reset)"
}
'''

[tasks."beads:label"]
description = "Add labels to a task"
run = '''
#!/usr/bin/env nu
def main [
    task_id: string # Task ID
    labels: string  # Comma-separated labels to add
] {
    # bd label --add does not exist; bd label add takes one label per call,
    # and does not split a comma-separated string, so loop per label.
    # Empty elements (trailing/double commas) are filtered out — bd label
    # add rejects an empty label ("label cannot be empty") and aborts the
    # loop, which would leave the issue partially labelled.
    for label in ($labels | split row "," | where $it != "") {
        bd label add $task_id $label
    }
    print $"(ansi cyan)Added labels to ($task_id): ($labels)(ansi reset)"
}
'''

[tasks."beads:tree"]
description = "Print the recursive task tree — every root with no argument, or the subtree rooted at a task ID (bd tree does not exist; this is bd list/children --pretty)"
run = '''
#!/usr/bin/env nu
# Both forms print the FULL recursive subtree, grandchildren included — not
# just immediate children. `bd tree` does not exist in 1.1.2; the whole-forest
# form is `bd list --pretty` and the rooted form is `bd children <id> --pretty`
# (which includes <id> itself as the root of the printed tree).
def main [task_id?: string] {
    if ($task_id | is-empty) {
        bd list --pretty
    } else {
        bd children $task_id --pretty
    }
}
'''

# beads:rebuild removed — bd rebuild does not exist in 1.1.2, and there is
# no SQLite cache to rebuild from JSONL in the Dolt-backed release (Dolt is
# the source of truth; .beads/issues.jsonl is export-only). SKILL.md maps
# the troubleshooting role to `bd doctor` ("Check and fix beads installation
# health"). Verified live: `bd doctor` exists, but as of 1.1.2 it errors
# "not yet supported in embedded mode" under this template's default init
# mode (beads:init), so no beads:doctor task is added here — run it
# directly (or use --server mode) when troubleshooting is needed.
