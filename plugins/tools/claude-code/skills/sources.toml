last_checked = "2026-08-04"
update_priority = "medium"
breaking_changes_likely = true
notes = "Live fetch 2026-08-04 for claude-skills-235: 'Constrain plugin dependency versions' page. Table row for the dependencies[].version field quotes verbatim: 'A semver range such as ~2.1.0, ^2.0, >=1.4, or =2.1.0. The dependency is fetched at the highest tagged version that satisfies this range.' Further down: 'The version field accepts any expression supported by Node's semver package, including caret, tilde, hyphen, and comparator ranges. Pre-release versions such as 2.0.0-beta.1 are excluded unless your range opts in with a pre-release suffix like ^2.0.0-0.' The range-conflict error table also references '||' OR-chains ('simplify long || chains'). This is the exact grammar validate-plugin.nu's is-semver-range implements — a range, not an exact version, confirming the existing is-semver helper (exact-version grammar) must not be reused unchanged for this field, per claude-skills-235's own AC."

