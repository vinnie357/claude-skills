last_checked = "2026-08-04"
update_priority = "medium"
breaking_changes_likely = true
notes = "Live fetch 2026-08-04 for claude-skills-215 confirmed outputStyles (string|array, replaces default output-styles/ scan), lspServers (string|array|object, defaults to .lsp.json at plugin root when unset), and experimental.themes / experimental.monitors (both string|array) as documented plugin.json fields. The experimental.themes / experimental.monitors keys also work unnested at the top level today, but claude plugin validate already warns on that unnested form, and a future release will require the nested experimental.* form. Re-fetched again 2026-08-04 for claude-skills-218/219 (same day, separate follow-up): confirmed 'dependencies' as a VALID plugin.json field under the 'Component path fields' table, shape array of plugin-name strings and/or {name, version} objects (e.g. [\"helper-lib\", { \"name\": \"secrets-vault\", \"version\": \"~2.1.0\" }]) — this directly contradicted the skill's prior 'Fields that must NOT appear in plugin.json' section and validate-plugin.nu's invalid_fields denylist, both fixed by claude-skills-218. Also confirmed the 5 previously-unmodeled fields as real, documented plugin.json fields: displayName (string, v2.1.143+), defaultEnabled (boolean, v2.1.154+), workflows (string|array, replaces default workflows/ scan), userConfig (object, enable-time prompted values), channels (array, message-channel declarations bound to an mcpServers key). Also confirmed upstream's own 'Unrecognized fields' section: claude plugin validate reports fields it doesn't recognize as WARNINGS, not errors — a plugin with only unrecognized-field warnings still passes and loads at runtime; --strict promotes warnings to errors. This directly informed claude-skills-219's fix (warn-on-unknown-field in validate-plugin.nu, not hard-fail). Re-fetched again 2026-08-04 for claude-skills-234 (same day, third pass): quoted verbatim the '--strict' paragraph — 'Pass --strict to treat warnings as errors. Use it in CI to catch a misspelled field name or a field left over from another tool's manifest before publishing, even though the plugin would load at runtime.' — confirming --strict promotes warnings (not just unrecognized-field ones) to a failing result, and that this is upstream's own recommended CI usage. Directly informed validate-plugin.nu's --strict flag."

