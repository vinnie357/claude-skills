# sources.toml - structured source-of-truth for one plugin's upstream dependencies.
# Place alongside sources.md in the plugin's skills/ directory.
#
# Three artifacts must agree:
#   .claude-plugin/plugin.json  - the manifest; its skills list and version are authoritative
#   skills/sources.toml         - THIS FILE: the structured data
#   skills/sources.md           - the hand-written narrative INDEX for this file
#
# Run `mise test:sources` to validate schema and three-way agreement.
# Run `mise sources:check` to compare current_version against upstream.

[meta]
plugin = "plugin-name"                 # REQUIRED. Must equal plugin.json `name`.
reviewed_at_plugin_version = "unknown" # REQUIRED. The plugin.json `version` at the last
                                       # ACTUAL sources review, or "unknown". A version-bump
                                       # commit never advances this - only a review does.
last_full_check = "unknown"            # REQUIRED. YYYY-MM-DD or "unknown".

# ----------------------------------------------------------------------------
# Each [[sources]] block tracks ONE upstream, covering ONE OR MORE skills.
# `skills` is a list because sources and skills are many-to-many: one upstream
# often documents several skills, and one skill may have several upstreams.
# ----------------------------------------------------------------------------

[[sources]]
skills = ["skill-name"]          # REQUIRED. Non-empty list of skill DIRECTORY names
                                 # from this plugin's plugin.json. Not a scalar.
name = "source-name"             # REQUIRED. Human-readable identifier (e.g. "apple-container").
                                 # Must appear in sources.md PROSE (URLs do not count) - append
                                 # it to the Entries: sentence on the index-pointer line if no
                                 # prose already names it. Never name an entry after a URL
                                 # fragment just to pass the check.
url = ""                         # REQUIRED unless check_method = "none".
releases_url = ""                # Optional but recommended.

# check_method controls how `mise sources:check` queries the latest version.
# Values: github-releases | hex-pm | crates-io | npm | docker-hub | endoflife-date | manual | none
#   github-releases / hex-pm / crates-io / npm / docker-hub / endoflife-date
#          - automated query, needs its ID field below
#   manual - an external upstream exists, but a human must check it
#   none   - there IS no external upstream (first-party doctrine authored here)
check_method = "manual"

# Fill in the field matching your check_method:
# github_repo = "owner/repo"    # REQUIRED iff check_method = "github-releases"
# hex_package = "package"       # REQUIRED iff check_method = "hex-pm"
# crate_name = "crate"          # REQUIRED iff check_method = "crates-io"
# npm_package = "package"       # REQUIRED iff check_method = "npm" ("@scope/name" ok)
# docker_image = "ns/repo"      # REQUIRED iff check_method = "docker-hub" (e.g. "library/node")
# docker_tag = "tag"            # OPTIONAL, check_method = "docker-hub" only. When set, compares
#                                # a specific pinned tag's content digest instead of the newest
#                                # tag's name (claude-skills-225) — see the docker-hub examples
#                                # below for when to use each.
# eol_product = "product"       # REQUIRED iff check_method = "endoflife-date" (e.g. "nodejs")

# The upstream version this skill's content was last verified or documented
# against. A QUOTED exact version string (e.g. "0.10.0"), or "unknown" when
# nobody has measured it yet OR the source has no discrete version to pin -
# that includes rolling/stable sources (117 of 119 "rolling" entries and 8 of
# 12 "stable" entries in this repo record "unknown" here; "stable"/"rolling"
# are version_constraint values below, never current_version values).
# A guessed version is fabrication - use "unknown".
current_version = "unknown"

# version_constraint describes how this source is versioned:
#   pre-1.0  - Actively developed, may break in any release
#   semver   - Follows Semantic Versioning (major.minor.patch)
#   rolling  - No discrete versions; a continuously updated source
#   stable   - Stable release channel
version_constraint = "semver"

# Date this source was last verified. YYYY-MM-DD or "unknown".
# Update after every check, even when no version change was found.
last_checked = "unknown"

# update_priority signals how urgently stale updates should be addressed:
#   high | medium | low
update_priority = "medium"

# Set true when minor/patch bumps in this source commonly break things.
breaking_changes_likely = false

# Optional short context. Long narrative belongs in sources.md.
notes = ""

# ----------------------------------------------------------------------------
# Example: CLI tool tracked via GitHub releases
# ----------------------------------------------------------------------------
# [[sources]]
# skills = ["container"]
# name = "apple-container"
# url = "https://github.com/apple/container"
# releases_url = "https://github.com/apple/container/releases"
# check_method = "github-releases"
# github_repo = "apple/container"
# current_version = "1.0.0"
# version_constraint = "semver"
# last_checked = "2026-06-09"
# update_priority = "high"
# breaking_changes_likely = true
# notes = "CLI commands change frequently; create a versioned template on update"

# ----------------------------------------------------------------------------
# Example: Hex.pm package
# ----------------------------------------------------------------------------
# [[sources]]
# skills = ["tidewave"]
# name = "tidewave"
# url = "https://hex.pm/packages/tidewave"
# releases_url = "https://github.com/phx-tools/tidewave/releases"
# check_method = "hex-pm"
# hex_package = "tidewave"
# current_version = "0.5.6"
# version_constraint = "semver"
# last_checked = "2026-03-25"
# update_priority = "medium"

# ----------------------------------------------------------------------------
# Example: crates.io package
# ----------------------------------------------------------------------------
# [[sources]]
# skills = ["wasm"]
# name = "wasmtime"
# url = "https://wasmtime.dev"
# releases_url = "https://github.com/bytecodealliance/wasmtime/releases"
# check_method = "crates-io"
# crate_name = "wasmtime"
# current_version = "28.0.0"
# version_constraint = "semver"
# last_checked = "2026-03-25"
# update_priority = "medium"

# ----------------------------------------------------------------------------
# Example: npm registry package
# ----------------------------------------------------------------------------
# [[sources]]
# skills = ["some-skill"]
# name = "some-npm-package"
# url = "https://www.npmjs.com/package/some-npm-package"
# check_method = "npm"
# npm_package = "some-npm-package"
# current_version = "4.2.0"
# version_constraint = "semver"
# last_checked = "2026-06-09"
# update_priority = "medium"

# ----------------------------------------------------------------------------
# Example: Docker Hub image tag (claude-skills-210, claude-skills-176). Tags
# are not semver in general, so a specific pinned tag that isn't itself
# version-shaped (e.g. "16-buster-slim") belongs in notes, not
# current_version — current_version = "unknown" with version_constraint =
# "rolling" is the schema-compliant way to track it. check-docker-hub
# reports "is a newer tag available" (equality against the most-recently-
# updated tag name), not "is there a newer semver release."
#
# claude-skills-225: this usage never transitions (see docker_tag example
# below for a source that actually reports drift for a specific pin).
# ----------------------------------------------------------------------------
# [[sources]]
# skills = ["act"]
# name = "node-docker-image"
# url = "https://hub.docker.com/_/node"
# check_method = "docker-hub"
# docker_image = "library/node"
# current_version = "unknown"
# version_constraint = "rolling"
# last_checked = "2026-08-04"
# update_priority = "low"
# notes = "skill content pins node:16-buster-slim; check for a newer tag manually against the pinned major"

# ----------------------------------------------------------------------------
# Example: Docker Hub image tag with drift detection (claude-skills-225).
# Setting docker_tag switches the check to the per-tag endpoint, comparing
# the pinned tag's content DIGEST instead of the newest tag's name — this
# actually transitions when the pinned tag is re-pushed (patched base
# image, rebuilt binary). current_version stores the last-observed digest,
# not a version string.
# ----------------------------------------------------------------------------
# [[sources]]
# skills = ["act"]
# name = "node-docker-image-pinned"
# url = "https://hub.docker.com/_/node"
# check_method = "docker-hub"
# docker_image = "library/node"
# docker_tag = "24-alpine"
# current_version = "sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43"
# version_constraint = "rolling"
# last_checked = "2026-08-04"
# update_priority = "low"
# notes = "skill content pins node:24-alpine; drift means the tag was re-pushed since last_checked"

# ----------------------------------------------------------------------------
# Example: endoflife.date product (claude-skills-210). Reports the newest
# release cycle's `latest` patch version.
# ----------------------------------------------------------------------------
# [[sources]]
# skills = ["some-skill"]
# name = "nodejs-eol"
# url = "https://endoflife.date/nodejs"
# check_method = "endoflife-date"
# eol_product = "nodejs"
# current_version = "20.11.0"
# version_constraint = "semver"
# last_checked = "2026-06-09"
# update_priority = "low"

# ----------------------------------------------------------------------------
# Example: documentation-based upstream, checked by hand.
# ONE entry covering SEVEN skills - the many-to-many case.
# ----------------------------------------------------------------------------
# [[sources]]
# skills = ["zig", "language", "build", "allocators", "testing", "c-interop", "troubleshooting"]
# name = "zig"
# url = "https://ziglang.org"
# releases_url = "https://ziglang.org/download/"
# check_method = "manual"
# github_repo = "ziglang/zig"
# current_version = "0.16.0"
# version_constraint = "pre-1.0"
# last_checked = "2026-06-12"
# update_priority = "medium"
# breaking_changes_likely = true
# notes = "Upstream stopped tagging GitHub releases; check download/index.json instead"

# ----------------------------------------------------------------------------
# Example: NO external upstream (first-party doctrine authored in this repo).
# check_method = "none" forbids url/releases_url/current_version/
# version_constraint/update_priority and the three ID fields, and REQUIRES
# notes - the entry must say WHY there is no upstream. That is the
# anti-fabrication point of making sources mandatory: an explicit recorded
# "no upstream" beats an exemption list nobody reads.
# ----------------------------------------------------------------------------
# [[sources]]
# skills = ["restraint", "agent-loop"]
# name = "internal-doctrine"
# check_method = "none"
# last_checked = "2026-07-30"
# notes = "First-party doctrine authored in this repo; no upstream to track. Provenance narrative in sources.md."
