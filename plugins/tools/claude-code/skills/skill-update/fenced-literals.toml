# fenced-literals.toml — registry of version literals pinned INSIDE markdown
# code fences and non-markdown templates (claude-skills-176).
#
# Distinct from sources.toml: sources.toml tracks "is there a newer version
# of this upstream overall" for a skill's documented content; this registry
# tracks "does this EXACT pinned literal still resolve, and is it EOL" for
# specific fenced examples that version_pin's prose-only agreement check
# (test/validate-skills-quality.nu check 17) never sees.
#
# Run `mise sources:fence-check` to query upstream live and get a report.
# Run `mise test:fenced-literals` (network-free) to check this file's own
# schema and that each `literal` string still appears in its named `file` —
# catches registry drift when a doc changes without updating this file.
#
# Inventory as of 2026-08-04 (claude-skills-176): a fresh sweep of the
# corpus for version-shaped tokens inside fences found 14 literals across
# 12 files. This does not match the bee's original "13 across 7 files" from
# 2026-07-29 — content has moved since (new skills, and claude-skills-210/
# 211/212 added prose in skill-update/SKILL.md that DISCUSSES several of
# these same literals as commentary, correctly excluded here since that
# text is analysis, not a pin). Excluded as non-pins (illustrate command
# syntax, not a real version claim): `mise install node@20.10.0` and
# `git tag v1.0.0` (core/mise/SKILL.md), `ansible-galaxy collection install
# community.general:==6.0.0` (ansible-roles/SKILL.md), and `@v4.1.0` →
# `@v4.2.2` (github/dependabot-consolidator — a hypothetical bump example).
#
# Deliberately excluded as a CATEGORY, not just individually: GitHub Actions
# `uses: owner/action@vN` floating-major-version pins (~30 occurrences
# across ~15 files, e.g. `actions/checkout@v7`, `jdx/mise-action@v4`). These
# are a different pattern from everything above — a floating major tag the
# action's maintainer re-points at their newest v7.x.x on every release, by
# GitHub's own recommended convention, not a discrete version a doc author
# chose and that can go stale the way `rev: v8.30.1` can. Whether a doc
# should upgrade from `@v7` to a newer major is a real, different question
# (major-version currency, not tag-existence/EOL) that this registry's
# schema does not answer today. Flagged here as a scope decision, not a
# silent omission — the bee's own worked examples (Docker image tags, CLI
# install examples, package pins) never named this pattern.

