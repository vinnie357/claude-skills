# -----------------------------------------------------------------------------
# claude-skills-232: independent sweep found these unregistered — same
# classes this registry already covers, reached via template mise.toml tool
# pins the earlier hand sweeps missed. All tag shapes verified live
# (2026-08-04) before registering: `mise ls-remote` / GitHub tags API /
# ziglang.org's download index as applicable, per file below.
#
# Versioned-template-directory rule (decided once here, applied uniformly to
# every entry below living under a bare `templates/<version>/` path,
# including awman's CURRENTLY-newest 0.11.0 and zig's CURRENTLY-newest
# 0.16.0): policy = "intentional-pin". Scope, stated explicitly per Gate 3 on
# claude-skills-232/233's PR: this covers the TOOL'S OWN version pin (the
# thing the directory is named/versioned after — awman's own version, zig's
# own version) — NOT any runtime or base-image pin that happens to live in
# the same directory (a node/erlang/postgres/debian version a versioned
# template also pins). Those get registered and reasoned about on their own
# terms (see the sbx elixir-tidewave and slidev entries elsewhere in this
# file, both policy=track, neither living in a templates/<version>/ path) —
# a runtime dependency doesn't freeze just because it ships inside an
# immutable tool-version snapshot; it can go EOL like any other tracked
# runtime regardless of which directory names it. Applying intentional-pin
# blanket-wide to everything under such a directory would make a future
# versioned template that also pins e.g. node or debian permanently
# EOL-silent for that runtime pin — a real risk since this rule is prose,
# not enforced code, and someone extending the pattern by imitation would
# reasonably assume "everything in here is intentional-pin" without this
# line. Rationale for the TOOL'S OWN pin specifically — per the
# /claude-code:skill-update convention ("When a CLI tool has breaking
# command changes across versions, create a versioned template"), a new
# upstream release gets a NEW templates/<version>/ directory; the existing
# ones are never edited in place to chase it (that's the entire point of
# keeping historical snapshots — see awman/skills/awman/SKILL.md's own
# "Immutable vX.Y.Z command snapshot" labels, and zig's matching comment
# on its own older template files). "Currently newest" is a transient
# property of the file tree, not of the pin text itself — the day a newer
# version ships, today's newest directory is demoted to historical without
# its own content changing at all. Treating the newest directory as "track"
# and the rest as "intentional-pin" would mean re-deciding this file's
# policy on every version bump for no behavioral gain: neither awman nor zig
# has an endoflife.date product (verified live: /api/v1/products/awman and
# /api/v1/products/zig both 404), so track vs intentional-pin has zero
# effect on the EOL half of the check either way — the distinction is
# purely documentary, and one rule applied uniformly is cheaper to reason
# about than a per-directory judgment call. Same rule generalizes the
# existing runex templates/0.0.7/mise.toml precedent above; it is not a new
# mechanism.
# -----------------------------------------------------------------------------

