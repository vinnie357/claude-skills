[[literals]]
file = "plugins/tools/slidev/skills/slidev/templates/mise.toml"
literal = 'node = "22"'
context = "node tool pin (bare major, mise fuzzy-resolves to newest 22.x.x) for the Slidev dev environment"
check_method = "manual"
eol_product = "nodejs"
eol_cycle = "22"
policy = "track"
notes = "Bare major version, not a discrete tag — no single GitHub tag or docker-hub tag literally named '22' to existence-check the way the docker-tag node:16/node:24 entries above do, so check_method=manual (same reasoning as this file's other manual+eol_product combinations). eol_cycle is bare major '22', consistent with the node:24/node:24-alpine entries above that also key by bare major cycle. literal is anchored to the key (`node = \"22\"`, not bare `22`) per Gate 3 on claude-skills-232/233's PR: a two-character bare literal is a substring of dates, ports, hashes, and other version numbers, so the occurrence counter is defeatable in both directions on it — an unrelated line containing `22` elsewhere inflates the count and fails CI on an intact pin, while a drift that happens to preserve the total count (e.g. bump to `24` while adding an unrelated `22` elsewhere) passes silently. Anchoring to the full `key = \"value\"` assignment removes both failure modes without changing the counting mechanism."
