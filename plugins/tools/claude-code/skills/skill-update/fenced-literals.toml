notes = "claude-skills-176's own named exception. act's current upstream docs (see Recommended Images section referenced here) still present node:16-buster-slim as THE micro-image example, so it stays pinned regardless of Node 16 being EOL (2023-09-11, confirmed live) — fixing it would contradict what act itself documents. Also the flagship case named in claude-skills-225: docker-hub's 'newest tag' signal is a degenerate staleness comparator for a deliberately-pinned tag (schema-compliant current_version=unknown/rolling usage reads no-pin forever; a version-shaped pin reads stale forever against a high-churn alias), so even setting policy aside, there is no meaningful DRIFT signal to report here today — only tag-still-exists (verified live: yes, last_updated 2023-09-07, frozen since Node 16's own EOL) and EOL-status context. Revisit once claude-skills-225 lands a real per-tag comparator."

