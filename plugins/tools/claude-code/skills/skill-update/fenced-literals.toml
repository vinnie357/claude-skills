# fenced-literals.toml — registry of version literals pinned INSIDE markdown
# code fences and non-markdown templates (claude-skills-176).
#
# Distinct from sources.toml: sources.toml tracks "is there a newer version
# of this upstream overall" for a skill's documented content; this registry
# tracks "does this EXACT pinned literal still resolve, and is it EOL" for
# specific fenced examples that version_pin's prose-only agreement check
# (test/validate-skills-quality.nu check 17) never sees.
#
# Run `mise sources:fence-check` to query upstream live and get a report.
# Run `mise test:fenced-literals` (network-free) to check this file's own
# schema and that each `literal` string still appears in its named `file` —
# catches registry drift when a doc changes without updating this file.
#
# Inventory: first pass (2026-08-04, grep-based hand sweep) found 14
# literals across 12 files. claude-skills-176 Gate 3 F1: an INDEPENDENT
# fence-aware sweep (a different method — a fence-state tracker plus six
# regex families, not hand-picked patterns) found 7 more genuine pins of
# classes this registry already covers and had simply missed:
# allium-tools@3.0.4, runex@0.0.7, postgres:15, redis:7-alpine, postgres:16,
# node:24, ubuntu:22.04 — see their entries below. claude-skills-230/231
# (2026-08-04, same day Gate 3 also found these): extended the registry to
# template mise.toml tool pins (nushell, sbx, graphify, runex — the same
# staleness surface reached via a template file instead of a markdown fence;
# no new mechanism needed, see the note above the first template entry) and
# added the two unregistered sbx elixir-tidewave postgres:16 occurrences for
# per-file attribution. claude-skills-232 (2026-08-04, same day): an
# independent sweep found six more unregistered template mise.toml pins —
# whamm, sbx elixir-tidewave (erlang + elixir), awman's three versioned
# templates (0.9.1/0.10.0/0.11.0), zig's three versioned templates
# (0.14.1/0.15.2/0.16.0), and slidev's bare-major node pin. Established the
# versioned-template-directory policy rule once, generalizing the existing
# runex templates/0.0.7/ precedent — see the claude-skills-232 section
# comment further down this file. Current total: 37 literals across 32
# files. This does
# not match the bee's original "13 across 7 files" from 2026-07-29 either —
# content has moved since (new skills, and claude-skills-210/211/212 added
# prose in skill-update/SKILL.md that DISCUSSES several of these same
# literals as commentary, correctly excluded here since that text is
# analysis, not a pin). The honest claim is: this is what a fence-aware sweep
# plus one independent cross-check found as of 2026-08-04, not a
# verified-complete inventory — a future sweep with yet another method could
# still find more.
#
# Excluded as non-pins (illustrate command syntax, not a real version
# claim): `mise install node@20.10.0` and `git tag v1.0.0` (core/mise/
# SKILL.md), `ansible-galaxy collection install community.general:==6.0.0`
# (ansible-roles/SKILL.md), and `@v4.1.0` → `@v4.2.2` (github/
# dependabot-consolidator — a hypothetical bump example).
#
# Deliberately excluded as a CATEGORY, not just individually (confirmed
# acceptable by the operator after F1's review): GitHub Actions `uses:
# owner/action@vN` floating-major-version pins (~30 occurrences across ~15
# files, e.g. `actions/checkout@v7`, `jdx/mise-action@v4`). These are a
# different pattern from everything above — a floating major tag the
# action's maintainer re-points at their newest v7.x.x on every release, by
# GitHub's own recommended convention, not a discrete version a doc author
# chose and that can go stale the way `rev: v8.30.1` can. Whether a doc
# should upgrade from `@v7` to a newer major is a real, different question
# (major-version currency, not tag-existence/EOL) that this registry's
# schema does not answer today. One exception was found and confirmed NOT
# a floating pin: `actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1`
# (github/dependabot-consolidator/references/consolidation-algorithm.md:63)
# is a full-commit-SHA pin with a `# v7.0.1` comment — but it is itself a
# STYLE ILLUSTRATION (the doc is teaching what a SHA-pinned action line
# looks like, not recommending this specific action be SHA-pinned), so it
# stays excluded on the same "illustrates syntax, not a real claim" basis
# as the mise/ansible examples above, not on the floating-tag basis.

