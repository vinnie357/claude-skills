# sources.toml - Machine-readable version tracking for skill dependencies
# Run `mise sources:check` to compare against the latest upstream release.

[meta]
plugin = "elixir"
reviewed_at_plugin_version = "0.1.9"
last_full_check = "2026-07-30"

# ----------------------------------------------------------------------------
# elixir-lang/elixir — the language's own hexdocs.pm/elixir/* pages, shared
# across six skills because they all ship from the same monorepo and version
# together: what-anti-patterns.html, code-anti-patterns.html,
# design-anti-patterns.html (anti-patterns skill; code-anti-patterns.html is
# also cited a second time from the style skill re: non-assertive pattern
# matching / complex else clauses — the two skills share this source rather
# than duplicating it), GenServer.html (otp skill), Config.html and
# Application.html (config skill), Port.html and System.html#cmd/3 (ports
# skill), naming-conventions.html and Kernel.SpecialForms.html#with/1 (style
# skill), and the ex_unit hexdocs (testing skill — ExUnit ships in
# lib/ex_unit of this same repo).
# ----------------------------------------------------------------------------
[[sources]]
skills = ["anti-patterns", "otp", "config", "ports", "style", "testing"]
name = "elixir-lang"
url = "https://hexdocs.pm/elixir/"
releases_url = "https://github.com/elixir-lang/elixir/releases"
check_method = "github-releases"
github_repo = "elixir-lang/elixir"
current_version = "1.19.5"
version_constraint = "semver"
last_checked = "2026-07-30"
update_priority = "medium"
breaking_changes_likely = false
notes = "current_version 1.19.5 is what sources.md pins as verified (Date Accessed 2026-03-25, 'Elixir Language' entry under the OTP skill section). Live GitHub API check 2026-07-30 shows v1.20.2 now published upstream — skill content not yet re-verified against it. hexdocs.pm/ex_unit is not a separately versioned hex package; it publishes alongside this same elixir release."

# ----------------------------------------------------------------------------
# erlang/otp — Erlang/OTP documentation cited from both the otp skill (design
# principles) and the ports skill (Ports reference manual, open_port/2, C
# Nodes, NIFs — all alternatives/foundations for the Port abstraction).
# ----------------------------------------------------------------------------
[[sources]]
skills = ["otp", "ports"]
name = "erlang/otp"
url = "https://www.erlang.org/doc/"
releases_url = "https://github.com/erlang/otp/releases"
check_method = "github-releases"
github_repo = "erlang/otp"
current_version = "28.4.1"
version_constraint = "semver"
last_checked = "2026-07-30"
update_priority = "medium"
breaking_changes_likely = false
notes = "current_version 28.4.1 is what sources.md pins as verified (Date Accessed 2026-03-25, 'Erlang/OTP' entry under the OTP skill section). Live GitHub API check 2026-07-30 shows OTP-29.0.4 now published upstream — skill content not yet re-verified against it."

