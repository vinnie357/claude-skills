# ----------------------------------------------------------------------------
# Tidewave (hex package) — MCP dev-tools integration, its own standalone
# skill nested under the Phoenix section of sources.md (no separate heading
# of its own). Pre-1.0 and actively changing per the CHANGELOG entries
# sources.md already quotes.
# ----------------------------------------------------------------------------
[[sources]]
skills = ["tidewave"]
name = "tidewave"
url = "https://hexdocs.pm/tidewave"
releases_url = "https://github.com/tidewave-ai/tidewave_phoenix"
check_method = "hex-pm"
hex_package = "tidewave"
current_version = "0.5.6"
version_constraint = "pre-1.0"
last_checked = "2026-07-30"
update_priority = "high"
breaking_changes_likely = true
notes = "current_version 0.5.6 is what sources.md pins as verified (Date Accessed 2026-05-16, released 2026-03-13 per CHANGELOG.md). Covers the GitHub repo, CHANGELOG.md, the three editor MCP setup pages (mcp_claude_code.html, mcp_codex.html, mcp_opencode.html) extracted into tidewave/references/mcp-setup.md, and the Gemini CLI mcp-server.md doc (upstream Tidewave docs have no Gemini CLI page, so that one page is a non-Tidewave reference for the httpUrl field shape — not tracked as a separate source, same treatment rig gives its docs.rig.rs mirror). Live hex.pm API check 2026-07-30 shows 0.8.1 now published — skill content not yet re-verified against it. mcp-setup.md's Cursor/VS Code/Zed table (added claude-skills-149) is carried over from a retired phoenix/references/tidewave.md and is UNVERIFIED against current upstream — Tidewave's docs site ships only the Claude Code, Codex, and opencode pages listed above, no Cursor/VS Code/Zed page to check the config keys against."

