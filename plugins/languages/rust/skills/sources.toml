# ----------------------------------------------------------------------------
# Rust compiler stable-release tracking (rust-lang/rust). This is the one
# entry that legitimately spans every skill in the plugin — every skill's
# content is written against the same toolchain edition, mirroring the zig
# plugin's precedent of one compiler-version entry covering all its skills.
# ----------------------------------------------------------------------------
[[sources]]
skills = ["rust", "ownership", "error-handling", "anti-patterns", "async", "testing", "troubleshooting", "cli"]
name = "rust-lang/rust"
url = "https://github.com/rust-lang/rust/releases"
releases_url = "https://github.com/rust-lang/rust/releases"
check_method = "github-releases"
github_repo = "rust-lang/rust"
current_version = "1.97.1"
version_constraint = "stable"
last_checked = "2026-07-30"
update_priority = "medium"
breaking_changes_likely = false
notes = "sources.md pins 1.97.1 (edition 2024), Date Accessed 2026-07-17. Live GitHub API check 2026-07-30 confirms tag_name 1.97.1 published 2026-07-16 is still the latest release — no drift. version_constraint is 'stable' rather than 'semver': Rust's edition-based backward-compatibility guarantee means breaking_changes_likely is false even across major/minor bumps."

