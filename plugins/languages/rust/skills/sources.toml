# sources.toml - Machine-readable version tracking for skill dependencies
# Run `mise sources:check` to compare against the latest upstream release.

[meta]
plugin = "rust"
reviewed_at_plugin_version = "0.1.7"
last_full_check = "2026-07-30"

# ----------------------------------------------------------------------------
# Official Rust Documentation homepage — general reference and best-practices
# pointer. Doc site with no independent release feed; content updates
# continuously alongside the toolchain (see rust-stable-releases below for
# the actual compiler version this plugin was verified against).
# ----------------------------------------------------------------------------
[[sources]]
skills = ["rust", "troubleshooting"]
name = "official-rust-documentation"
url = "https://doc.rust-lang.org/stable/"
check_method = "manual"
current_version = "unknown"
version_constraint = "rolling"
last_checked = "2025-11-15"
update_priority = "low"
breaking_changes_likely = false
notes = "sources.md records this as 'Date Accessed: 2025-11-15'; not re-verified live in this pass. Purpose: Rust language features, standard library, best practices, patterns — the 'best practices, patterns' angle is why troubleshooting is also covered here."

