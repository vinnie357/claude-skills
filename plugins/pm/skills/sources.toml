# ----------------------------------------------------------------------------
# Internal composition — spec-harvest. sources.md's own words: "Internal
# sources — this skill is composed of conventions from other skills in this
# marketplace." check_method = "none" is the explicit representation for
# that, not a gap to fill with a fabricated URL.
# ----------------------------------------------------------------------------
[[sources]]
skills = ["spec-harvest"]
name = "internal-composition-spec-harvest"
check_method = "none"
last_checked = "2026-07-15"
notes = "Composed from conventions in sibling first-party skills, per sources.md: /qa:qa (Gherkin dialect reference, plugins/tools/qa/skills/qa/references/gherkin-format.md), /core:bees (read-only query surface: list/show/ready/prime/dep list/comment list), /core:anti-fabrication (confidence-tagging discipline for harvested specs), /core:agent-loop (pm-lead -> pm-discovery -> pm-separator -> pm-sdlc-assessor -> pm-spec-writer -> pm-prd-author team model), /core:security (OWASP categories and secret-scanning vocabulary feeding the SDLC checklist). Genuine external upstreams the skill cites directly are tracked as separate entries below (cucumber.io, agilealliance.org, spdx.org, owasp.org, getdx.com)."

