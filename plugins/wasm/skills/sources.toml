# sources.toml - Machine-readable version tracking for skill dependencies
# Run `mise sources:check` to compare against the latest upstream release.

[meta]
plugin = "wasm"
reviewed_at_plugin_version = "0.1.4"
last_full_check = "2026-08-04"

# ----------------------------------------------------------------------------
# Wasmtime — the runtime itself. Merges sources.md's two separate mentions
# ("Wasmtime Documentation" at docs.wasmtime.dev and "Wasmtime API Reference
# (Rust)" at docs.rs/wasmtime) into one entry: both describe the same crate
# at the same version, so tracking them as two near-identical sources would
# just duplicate the same drift check.
# ----------------------------------------------------------------------------
[[sources]]
skills = ["wasmtime"]
name = "wasmtime"
url = "https://docs.wasmtime.dev/"
releases_url = "https://github.com/bytecodealliance/wasmtime/releases"
check_method = "crates-io"
crate_name = "wasmtime"
current_version = "47.0.3"
version_constraint = "semver"
last_checked = "2026-08-04"
update_priority = "high"
breaking_changes_likely = true
notes = "Live crates.io check 2026-08-04 shows max_version 47.0.3 (up from 47.0.2 on 2026-07-30). Wasmtime ships major-version bumps roughly monthly, hence high priority / breaking_changes_likely=true even though the numbering is nominally semver. Content-verification pass (claude-skills-204, 2026-08-04) found host-rust.md, guest-rust.md, and overview.md pinned wasmtime/wasmtime-wasi to the stale example version \"29\" and used the pre-reorg wasmtime_wasi API: crate root add_to_linker_sync/async and a preview1 module both moved to p1::/p2:: submodules (confirmed against docs.rs/wasmtime-wasi/latest and docs.wasmtime.dev/examples-wasip1.html + examples-wasip2.html), and WasiView::ctx() now returns a single WasiCtxView<'_> instead of separate ctx()/table() methods. All corrected in this pass. Also cites docs.rs/wasmtime/latest/wasmtime/ as the Rust API-reference mirror of the same crate — not tracked as a separate source."

