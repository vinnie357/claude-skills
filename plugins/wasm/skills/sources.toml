# sources.toml - Machine-readable version tracking for skill dependencies
# Run `mise sources:check` to compare against the latest upstream release.

[meta]
plugin = "wasm"
reviewed_at_plugin_version = "0.1.3"
last_full_check = "2026-07-30"

# ----------------------------------------------------------------------------
# Wasmtime — the runtime itself. Merges sources.md's two separate mentions
# ("Wasmtime Documentation" at docs.wasmtime.dev and "Wasmtime API Reference
# (Rust)" at docs.rs/wasmtime) into one entry: both describe the same crate
# at the same version, so tracking them as two near-identical sources would
# just duplicate the same drift check.
# ----------------------------------------------------------------------------
[[sources]]
skills = ["wasmtime"]
name = "wasmtime"
url = "https://docs.wasmtime.dev/"
releases_url = "https://github.com/bytecodealliance/wasmtime/releases"
check_method = "crates-io"
crate_name = "wasmtime"
current_version = "unknown"
version_constraint = "semver"
last_checked = "2026-07-30"
update_priority = "high"
breaking_changes_likely = true
notes = "sources.md pins no version for this skill's content. Live crates.io check 2026-07-30 shows max_version 47.0.2 (GitHub releases confirm tag v47.0.2, published 2026-07-21). Wasmtime ships major-version bumps roughly monthly, hence high priority / breaking_changes_likely=true even though the numbering is nominally semver. Also cites docs.rs/wasmtime/latest/wasmtime/ as the Rust API-reference mirror of the same crate — not tracked as a separate source."

# ----------------------------------------------------------------------------
# Bytecode Alliance — the organization behind Wasmtime, WASI, and the
# Component Model. Shared between wasmtime and wit since it is the umbrella
# org for both.
# ----------------------------------------------------------------------------
[[sources]]
skills = ["wasmtime", "wit"]
name = "bytecodealliance"
url = "https://bytecodealliance.org/"
check_method = "manual"
current_version = "unknown"
version_constraint = "rolling"
last_checked = "unknown"
update_priority = "low"
breaking_changes_likely = false
notes = "Organization overview page, not a versioned artifact; sources.md gives no Date Accessed for this entry."

