# Prose gate for this marketplace (claude-skills-306).
#
# Two registers, per /core:technical-english:
#   Strict   — procedural text a reader acts on. Agent definitions, slash
#              commands, ADR decisions. Ambiguity here changes behaviour.
#   Flavored — explanatory prose a human reads for understanding. Skill
#              bodies, references, READMEs. Voice earns its place.
#
# Every rule ships at `warning` while the corpus is cleaned. Only `error`
# exits non-zero, so the gate reports without blocking. Promote a rule to
# `error` in its own YAML once its findings reach zero — that burn-down is
# tracked per rule, not as one flag day.
StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Flavored

# Procedural surfaces take the strict register.
[plugins/*/agents/*.md]
BasedOnStyles = Flavored, Strict

[plugins/*/*/agents/*.md]
BasedOnStyles = Flavored, Strict

[plugins/*/commands/*.md]
BasedOnStyles = Flavored, Strict

[plugins/*/*/commands/*.md]
BasedOnStyles = Flavored, Strict
