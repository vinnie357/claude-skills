# mise configuration for claude-skills marketplace

[tools]
# nushell is pinned deliberately — breaking changes are common between minor
# pre-1.0 releases and "latest" lets CI absorb them silently. To update: bump
# the version below, run `mise install`, then `mise test` to confirm the
# whole suite (including every .nu script this marketplace ships) is green.
"github:nushell/nushell" = { version = "0.113.1", exe = "nu", platforms = '{ linux-arm64 = { asset_pattern = "nu-*-aarch64-unknown-linux-gnu.tar.gz" }', " linux-x64 " = ' { asset_pattern = "nu-*-x86_64-unknown-linux-gnu.tar.gz" }', " macos-arm64 " = ' { asset_pattern = "nu-*-aarch64-apple-darwin.tar.gz" }', " macos-x64 " = ' { asset_pattern = "nu-*-x86_64-apple-darwin.tar.gz" } }' }
act = "latest"  # Local GitHub Actions testing
claude = "latest"  # Self-contained Bun binary; bypasses npm/node toolchain breakage
gitleaks = "latest"  # Native binary preferred by scripts/gitleaks.nu over container runtimes (claude-skills-209)

# Note: Lima and Colima are macOS-only tools for local act testing
# Install manually on Mac: mise install lima colima

# Multi-arch bees install
[tools."github:ctxshift/bees"]
version = "latest"

[tools."github:ctxshift/bees".platforms]
linux-x64 = { asset_pattern = "bees-linux-x86_64.tar.gz" }
linux-arm64 = { asset_pattern = "bees-linux-aarch64.tar.gz" }
macos-arm64 = { asset_pattern = "bees-macos-aarch64.tar.gz" }
macos-x64 = { asset_pattern = "bees-macos-x86_64.tar.gz" }

[tasks.ci]
description = "Full CI gate (workspace `mise run ci` convention) — runs all validation tests"
depends = ["test"]

[tasks.test]
# test:version-bumps is deliberately NOT a dependency here — it needs a real
# base ref to diff against, which is only meaningful in the dedicated
# "check-version-bumps" CI job (targets origin/<base_ref> on the actual PR).
# Run it directly with `mise run test:version-bumps <base>` when needed locally.
description = "Run all validation tests (Claude native + custom)"
depends = ["test:claude", "test:marketplace", "test:plugins", "test:skills-quality", "test:core-list", "test:disclosure", "test:sources", "test:fenced-literals"]

[tasks."test:claude"]
description = "Run Claude's native plugin validation"
run = """
#!/usr/bin/env nu

print "🔍 Running Claude native validation..."
print ""

# Resolve the mise-managed claude binary explicitly. PATH order on systems
# that also have /opt/homebrew/bin/claude (npm-installed) finds homebrew's
# node-based binary first, which can fail at runtime due to llhttp ABI drift.
# The mise-managed claude is a self-contained Bun binary with no node deps.
let claude_path = (do { mise which claude } | complete)

if $claude_path.exit_code != 0 or ($claude_path.stdout | str trim | is-empty) {
    if ($env.CI? | is-not-empty) {
        print "❌ mise-managed claude not found in CI - failing"
        print "   Install via: mise install claude@latest"
        exit 1
    }
    print "⚠️  mise-managed claude not found - skipping native validation"
    print "   Install via: mise install claude@latest"
    exit 0
}

let claude_bin = ($claude_path.stdout | str trim)
print $"Using ($claude_bin)"

let result = (do { ^$claude_bin plugin validate . } | complete)

if $result.exit_code == 0 {
    print $result.stdout
    print ""
    print "✅ Claude native validation passed!"
} else {
    print $result.stdout
    print $result.stderr
    print ""
    print "❌ Claude native validation failed!"
    exit 1
}
"""

[tasks."test:marketplace"]
description = "Validate marketplace.json with custom checks (source paths, etc.)"
run = """
#!/usr/bin/env nu

print "📦 Validating marketplace.json (custom checks)..."

let repo_root = (git rev-parse --show-toplevel | str trim)
let marketplace_path = ($repo_root | path join ".claude-plugin" "marketplace.json")

let marketplace = (open $marketplace_path)
mut errors = []

# Check required fields
if ($marketplace | get -o name) == null {
    $errors = ($errors | append "Missing required field: name")
}

if ($marketplace | get -o owner) == null {
    $errors = ($errors | append "Missing required field: owner")
}

if ($marketplace | get -o plugins) == null {
    $errors = ($errors | append "Missing required field: plugins")
}

# Validate plugin entries
for plugin in $marketplace.plugins {
    let name = ($plugin | get -o name | default "<unnamed>")

    if ($plugin | get -o source) == null {
        $errors = ($errors | append $"Plugin '($name)' missing required field: source")
    } else {
        let source_type = ($plugin.source | describe)
        if $source_type == "string" {
            # Local source must start with "./"
            if not ($plugin.source | str starts-with "./") {
                $errors = ($errors | append $"Plugin '($name)' local source must start with './': ($plugin.source)")
            }
        } else if ($source_type | str starts-with "record") {
            # External source - validate required fields
            if ($plugin.source | get -o source) == null {
                $errors = ($errors | append $"Plugin '($name)' source object missing 'source' field")
            } else if ($plugin.source.source not-in ["github", "url"]) {
                $errors = ($errors | append $"Plugin '($name)' invalid source type: ($plugin.source.source)")
            }
            if ($plugin.source | get -o repo) == null and ($plugin.source | get -o url) == null {
                $errors = ($errors | append $"Plugin '($name)' source object missing 'repo' or 'url' field")
            }
        } else {
            $errors = ($errors | append $"Plugin '($name)' source must be string or object")
        }
    }
}

# Static version-sync check: every local plugin's plugin.json version must
# equal its marketplace.json entry version (includes the all-skills root
# plugin.json at .claude-plugin/plugin.json, source "./").
for plugin in $marketplace.plugins {
    if (($plugin.source | describe) | str starts-with "record") { continue }
    let plugin_dir = ($repo_root | path join ($plugin.source | str replace --regex '^\\./' ''))
    let plugin_json_path = ($plugin_dir | path join ".claude-plugin" "plugin.json")
    if not ($plugin_json_path | path exists) { continue }
    let local_version = (open $plugin_json_path | get -o version)
    let marketplace_version = ($plugin | get -o version)
    if $local_version != $marketplace_version {
        $errors = ($errors | append $"Plugin '($plugin.name)' version mismatch: plugin.json=($local_version), marketplace.json=($marketplace_version)")
    }
}

if ($errors | length) > 0 {
    print ""
    for error in $errors {
        print $"❌ ($error)"
    }
    print ""
    print "❌ marketplace.json validation failed!"
    exit 1
} else {
    print "✅ marketplace.json is valid!"
}
"""

[tasks."test:plugins"]
description = "Validate all plugin.json files (local and external)"
run = """
#!/usr/bin/env nu

let repo_root = (git rev-parse --show-toplevel | str trim)
nu ($repo_root | path join "plugins" "tools" "claude-code" "skills" "claude-plugins" "scripts" "validate-plugin.nu") --self-test

print "🔍 Validating all plugins..."
print ""

let marketplace = (open ($repo_root | path join ".claude-plugin" "marketplace.json"))

mut all_passed = true
mut local_count = 0
mut external_count = 0

for plugin in $marketplace.plugins {
    let source_type = ($plugin.source | describe)

    # Handle external plugins (source is an object)
    if ($source_type | str starts-with "record") {
        $external_count = $external_count + 1

        # Only clone GitHub sources
        if ($plugin.source | get -o source) == "github" {
            let repo = ($plugin.source | get -o repo)
            let github_url = $"https://github.com/($repo).git"
            let temp_dir = (mktemp -d)

            print $"📥 plugin: ($plugin.name) [cloning from ($repo)]..."

            let clone_result = (do { git clone --depth 1 --quiet $github_url $temp_dir } | complete)
            if $clone_result.exit_code != 0 {
                print $"❌ plugin: ($plugin.name) - failed to clone"
                $all_passed = false
                rm -rf $temp_dir
            } else {
                # Validate the cloned plugin
                let plugin_json = ($temp_dir | path join ".claude-plugin" "plugin.json")
                if ($plugin_json | path exists) {
                    let ext_plugin = (open $plugin_json)
                    if ($ext_plugin | get -o name) == $plugin.name {
                        print $"✅ plugin: ($plugin.name) [external]"
                    } else {
                        print $"❌ plugin: ($plugin.name) - name mismatch in plugin.json"
                        $all_passed = false
                    }
                } else {
                    print $"❌ plugin: ($plugin.name) - no .claude-plugin/plugin.json found"
                    $all_passed = false
                }
                rm -rf $temp_dir
            }
        } else {
            print $"⏭️  plugin: ($plugin.name) [non-github external - skipped]"
        }
    } else {
        $local_count = $local_count + 1
        let result = (do { nu ($repo_root | path join "test" "validate-plugin.nu") $plugin.name } | complete)
        if $result.exit_code == 0 {
            print $"✅ plugin: ($plugin.name)"
        } else {
            print $"❌ plugin: ($plugin.name)"
            $all_passed = false
        }
    }
}

print ""
print $"📊 Local: ($local_count), External: ($external_count)"
print ""

if $all_passed {
    print "✨ All plugins are valid!"
} else {
    print "❌ Some plugin validations failed"
    exit 1
}
"""

